<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f0ecdf"><title>Research — Gut Atlas</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/learn.css"><link rel="stylesheet" href="/research.css"><script src="/vendor/d3.min.js" defer></script><script src="/research.js" defer></script><link rel="stylesheet" href="/contribute.css"><script src="/contribute.js" defer></script></head>
<body data-page="research">
<header class="masthead"><a class="wordmark" href="/" aria-label="Gut Atlas, the living anatomy"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M12 7v7c-6 2-4 7 1 7h7c4 0 4 5 0 5h-6M20 8c5 3 5 8 0 9h-5"/></svg><span>gut atlas</span></a><form id="literature-search" role="search"><label class="sr-only" for="paper-query">Search the research library</label><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="m12 12 5 5"/></svg><input id="paper-query" type="search" placeholder="A paper, organism, molecule, question…" autocomplete="off"></form><nav class="site-nav" aria-label="Atlas"><a href="/">Learn</a><a href="/explore">Explore</a><a href="/research" aria-current="page">Research</a><a href="/references">References</a></nav></header>
<main class="research-layout">
<aside class="research-rail"><a id="return-context" href="/" hidden></a><h1>Research</h1><p><a href="/references">Sources & reading routes ↗</a></p><div id="library-counts" aria-live="polite">Opening the library…</div><nav id="research-lenses" aria-label="Organise papers"><button data-lens="topics" aria-pressed="true">Phenomenon</button><button data-lens="taxa">Organism</button><button data-lens="regions">Gut region</button><button data-lens="functions">Molecule & function</button><button data-lens="study_type">Study design</button><button data-lens="year">Through time</button></nav><details class="research-filters"><summary>Filter the library</summary><label for="region-filter">Gut region</label><select id="region-filter"><option value="">All regions</option></select><label for="design-filter">Study design</label><select id="design-filter"><option value="">All studies</option></select><label for="population-filter">Reviewed population</label><select id="population-filter"><option value="">All populations</option></select><label class="check-filter"><input type="checkbox" id="free-filter"> Free to read</label><label class="check-filter"><input type="checkbox" id="notes-filter"> With reading notes</label></details><div id="active-filters"></div><div class="research-exports"><button id="research-json">Export JSON ↓</button><button id="research-bib">Export BibTeX ↓</button></div></aside>
<section class="research-field" aria-label="Research map and paper list"><div class="research-field-top"><div id="map-status" role="status"></div><div class="research-display" role="group" aria-label="Research display"><button data-display="map" aria-pressed="true">Map</button><button data-display="list" aria-pressed="false">List</button></div></div><div id="map-breadcrumb"></div><div id="research-stage"><svg id="paper-map" viewBox="0 0 1000 800" role="group" aria-label="Research papers and their shared subjects"></svg></div><div id="research-list" hidden></div><div class="research-map-key"><span><i class="key-note"></i> Reading note</span><span><i class="key-paper"></i> Paper</span><span><i class="key-citation"></i> Indexed citation</span><span><i class="key-membership"></i> Shared subject</span></div><div id="research-error" hidden></div></section>
<aside id="paper-panel" aria-label="Paper details"><div class="panel-idle"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="36" cy="35" r="23"/><circle cx="81" cy="70" r="30"/><path d="M36 35 81 70"/><circle cx="36" cy="35" r="3"/><circle cx="81" cy="70" r="3"/></svg><p>Reading notes</p><div id="reading-starts"></div></div></aside>
</main></body></html>
